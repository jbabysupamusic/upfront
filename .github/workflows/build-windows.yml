# Builds UPFRONT for Windows on GitHub's computers and publishes a ready-to-run
# installer on your repository's "Releases" page. Runs on every upload.
name: Build UPFRONT

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the VST3
        run: |
          cmake -B build -A x64
          cmake --build build --config Release --parallel

      - name: Make the installer and portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:UPFRONT_VERSION = "1.1.${{ github.run_number }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\UPFRONT.iss
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item -Recurse build\UPFRONT_artefacts\Release\VST3\UPFRONT.vst3 portable\
          Copy-Item installer\Install.bat portable\
          Copy-Item "START HERE.md" portable\
          Compress-Archive -Path portable\* -DestinationPath dist\UPFRONT-Portable.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: UPFRONT v1.1.${{ github.run_number }}
          make_latest: true
          body: |
            **Download `UPFRONT-Setup.exe`, run it, then in FL Studio: Options > Manage plugins > Find installed plugins.**
            (No admin access? Use `UPFRONT-Portable.zip` and double-click `Install.bat`.)
          files: |
            dist/UPFRONT-Setup.exe
            dist/UPFRONT-Portable.zip
